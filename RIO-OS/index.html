<style>

#fl.on{opacity:1;transform:translate(-50%,0)}#fl.ok{border-color:var(--g);color:var(--g)}#fl.bad{border-color:var(--r);color:var(--r)}

.fring{--p:0;--cl:var(--c);width:260px;height:260px;border-radius:50%;margin:14px auto;display:grid;place-items:center;position:relative;background:conic-gradient(var(--cl) calc(var(--p)*1%),var(--glass2) 0);box-shadow:0 0 44px rgba(34,229,255,.18);transition:box-shadow .4s}

</style>

<script>
'use strict';
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const M=s=>{const[a,b]=String(s||'0:0').split(':');return(+a||0)*60+(+b||0)};
const T=m=>{m=Math.max(0,Math.min(1440,Math.round(m)));return String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dd=(a,b)=>Math.round((new Date(b+'T00:00')-new Date(a+'T00:00'))/864e5);
const addDays=(k,n)=>{const d=new Date(k+'T00:00');d.setDate(d.getDate()+n);return ymd(d)};
const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
const hm=m=>m<60?m+'m':Math.floor(m/60)+'h '+(m%60)+'m';
const TK=()=>ymd(new Date());
const fmtHMS=ms=>{const s=Math.floor(ms/1000);return String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor(s/60)%60).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const mmss=s=>{s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
/* ---------- state ---------- */
const SUBS={EMATHS:'Engineering Mathematics',EPHY:'Engineering Physics',ECE:'Electronics & Comm. Eng.',FME:'Fundamentals of Mech. Eng.'};
const DEF={v:2,set:{wake:'06:45',sleep:'22:45',cs:'10:00',ce:'16:00',arrive:'',commute:15,buf:5,lunch:'13:30',dinner:'21:00',cookAM:40,cookPM:45,bath:15,wo:20,woOn:true,woDays:5,study:120,brk:10,peak:'17:00',personal:60,homeWake:'07:30',homeStudy:90,cspeed:1,theme:'dark',pf:25,ps:5,pl:15,pc:4,pauto:1,snd:1,notif:1,pushGoal:50},
days:{},att:{},focus:{},top3:{},asg:[],topics:[],doubts:[],c:{done:{},deadline:'2026-11-15',notes:'',errors:''},hist:[],snaps:[],snapDate:'',pomo:{},po:null,push:{},mood:{},
carry:[],rolled:'',tests:[],skl:{},sess:[],sw:{run:0,t0:0,acc:0,sk:'other',lb:''},cd:null,skill:'auto',skLabel:'',fmode:'pomo'};
let st=JSON.parse(JSON.stringify(DEF)),view='today',draft=null,pend=null;
const idb=()=>new Promise((r,j)=>{const q=indexedDB.open('rio-life-os',1);q.onupgradeneeded=()=>q.result.createObjectStore('s');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});
const dbGet=async()=>{try{const d=await idb();return await new Promise(r=>{const q=d.transaction('s').objectStore('s').get('st');q.onsuccess=()=>r(q.result);q.onerror=()=>r()})}catch(e){return}};
let tm;const save=()=>{clearTimeout(tm);tm=setTimeout(async()=>{try{const d=await idb();d.transaction('s','readwrite').objectStore('s').put(JSON.parse(JSON.stringify(st)),'st')}catch(e){}},200)};
const merge=o=>{const s=JSON.parse(JSON.stringify(DEF));if(!o||typeof o!=='object')return s;for(const k in s){if(o[k]===undefined)continue;s[k]=(s[k]&&typeof s[k]==='object'&&!Array.isArray(s[k]))?{...s[k],...o[k]}:o[k]}return s};
const getDay=k=>st.days[k]||(st.days[k]={types:new Date(k+'T00:00').getDay()?['college']:[],events:[],blocks:[],q:[],w:[],mode:'full'});
/* ---------- C course data ---------- */
const CH=`00:00:00|Story of CRK
00:04:37|Chapter 0
00:34:13|Chapter 1
01:08:25|Chapter 1 Practice Set
01:26:02|Chapter 2
01:56:42|Chapter 2 Practice Set
02:06:00|Chapter 3
02:48:29|Chapter 3 Practice Set
03:17:47|Chapter 4
04:07:00|Chapter 4 Practice Set
04:33:59|Project 1
04:46:49|Chapter 5
05:24:53|Chapter 5 Practice Set
05:48:10|Chapter 6
06:19:31|Chapter 6 Practice Set
06:36:47|Chapter 7
07:06:01|Chapter 7 Practice Set
07:32:48|Chapter 8
07:53:26|Chapter 8 Practice Set
08:13:17|Chapter 9
08:36:18|Chapter 9 Practice Set
09:02:06|Chapter 10
09:17:52|Chapter 10 Practice Set
09:30:52|Project 2
09:39:32|Chapter 11
09:52:57|Chapter 11 Practice Set
10:01:37|Conclusion`.split('\n').map((l,i)=>{const[t,n]=l.split('|'),[h,m,s]=t.split(':').map(Number),ts=h*3600+m*60+s;return{i,t,n,ts}}).map((c,i,a)=>({...c,dur:Math.max(0,(i<a.length-1?a[i+1].ts:36097)-c.ts)}));
const cStats=()=>{const sp=st.set.cspeed||1,rem=CH.filter(c=>!st.c.done[c.i]).reduce((a,c)=>a+c.dur,0),tot=36097;return{remSec:rem,remMin:Math.ceil(rem/60/sp),pct:Math.round(100*(tot-rem)/tot),n:CH.filter(c=>st.c.done[c.i]).length}};
const revDue=k=>st.topics.flatMap(t=>(t.rev||[]).filter(r=>!r.done&&r.d<=k).map(r=>({t,r})));
/* ---------- SCHEDULER ENGINE ---------- */
const OFF=['holiday','cancelled','home','travel','fullout','sick','leave'];
const COLLX=['late','assign','meeting','eve','low','exam','test','project']; /* these day types imply a college day (Mon-Sat) */
const isWo=(wd,n)=>!([0,3,5,2,6,1].slice(0,Math.max(0,7-n))).includes(wd);
function gen(k,day,from=0){
 const S=st.set,wd=new Date(k+'T00:00').getDay(),ty=new Set(day.types);
 if(wd!==0&&day.types.some(x=>COLLX.includes(x)))ty.add('college');
 const home=ty.has('home'),sick=ty.has('sick'),mode=day.mode||'full',rec=sick||mode==='recovery',low=ty.has('low')||mode==='compact'||rec;
 const off=OFF.some(x=>ty.has(x)),cd=ty.has('college')&&!off;
 const wake=M(day.wake||(home?S.homeWake:S.wake)),sleep=M(S.sleep),wind=sleep-30,cm=+S.commute,buf=+S.buf;
 const csT=M(day.cs||S.cs),ceT=M(day.ce||S.ce);
 const kept=(day.blocks||[]).filter(b=>(b.done||b.man)&&!b.fx).map(b=>({...b}));
 const B=kept.map(b=>b),Q=[],W=[],busy=kept.map(b=>[b.s,b.e]),prov={};
 kept.forEach(b=>{if(b.key)prov[b.key]=(prov[b.key]||0)+(b.e-b.s)});
 if(from){busy.push([0,from]);(day.blocks||[]).filter(b=>!b.done&&!b.man&&b.k&&b.s<from&&!b.fx).forEach(b=>Q.push({t:b.t,d:b.e-b.s,key:b.key,why:'Time passed — rescheduled from today'}))}
